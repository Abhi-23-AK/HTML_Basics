<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <link rel="stylesheet" href="borders.css">
    <style>
        <--!border Properties--!>
       h1{
        border:34px solid rgb(4,56,78);
    }
    h2{border:23px ridge rgb(131, 141, 133);}
    h3{border-top: 15px double rgb(3, 68, 255);}
    h3{border-bottom: 10px double rgb(3, 68, 255);}
    h3{border-left: 15px dashed rgb(3, 68, 255);}
    h3{border-right: 155px double rgb(3, 68, 255);} 

    /*margin Properties*/
h2{margin:30px 39px 46px 50px;}
h3{outline: 5px solid rgb(17, 255, 0);}

    /*Padding Properties*/
h3{outline-offset: 12px;
padding: 19px 20px 30px 40px;
}



    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <h2>Welcome to My Website</h2>
    <h3>Welcome to My Website</h3>
    <h4>Welcome to My Website</h4>
</body>
</html>
